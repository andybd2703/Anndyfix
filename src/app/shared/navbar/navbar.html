<nav class="navbar">
  <div class="navbar__brand">
    <a class="navbar__logo" routerLink="/" [attr.aria-label]="'navbar.logoAria' | translate">
      <img class="navbar__logo-image" src="logo.ico" alt="" />
      <span>{{ 'navbar.marca' | translate }}</span>
    </a>
    <span class="navbar__tag">{{ 'navbar.tag' | translate }}</span>
  </div>

  <button class="navbar__toggle" type="button"
    [attr.aria-label]="(menuOpen ? 'navbar.cerrarMenu' : 'navbar.abrirMenu') | translate" (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div class="navbar__menu" [class.open]="menuOpen">
    <ul class="navbar__links">
      <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
          (click)="scrollToTop()">{{ 'navbar.inicio' | translate }}</a></li>
      <li><a routerLink="/servicios" routerLinkActive="active" (click)="scrollToTop()">{{ 'navbar.servicios' | translate
          }}</a></li>
      <li><a routerLink="/contacto" routerLinkActive="active" (click)="scrollToTop()">{{ 'navbar.contacto' | translate
          }}</a></li>
    </ul>
    <a class="navbar__cta" routerLink="/contacto" (click)="scrollToTop()">{{ 'navbar.cta' | translate }}</a>
  </div>
</nav>
